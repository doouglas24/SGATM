<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGATM - Login de Funcionário</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .error { color: #e74c3c; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>SGATM - Acesso Restrito</h2>
        
        <div th:if="${erro}" class="error" th:text="${erro}"></div>

        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="input-group">
                <label for="senha">Palavra-passe:</label>
                <input type="password" id="senha" name="senha" required />
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
